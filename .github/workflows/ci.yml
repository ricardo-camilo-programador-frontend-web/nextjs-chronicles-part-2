name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validar Linting e Formatacao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Instalar browsers Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Executar Lint
        run: pnpm run lint

      - name: Checagem de tipos
        run: pnpm run type-check

      - name: Testes
        run: pnpm run test

      - name: Testes E2E
        run: pnpm run test:e2e

  build:
    name: Build do Projeto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: "https://persona-nextjs-chronicles-part-2.netlify.app"
      NEXT_PUBLIC_PORTFOLIO_URL: "https://ricardo-camilo-programador-frontend-web.github.io/portfolio2.0"
      NEXT_PUBLIC_GITHUB_URL: "https://github.com/ricardo-camilo-programador-frontend-web"
      NEXT_PUBLIC_LINKEDIN_URL: "https://www.linkedin.com/in/ricardo-camilo-programador-frontend-web-developer"
      NEXT_PUBLIC_X_URL: "https://x.com/Ricardo50993066"
      NEXT_PUBLIC_INSTAGRAM_URL: ""
      NEXT_PUBLIC_YOUTUBE_URL: ""
      NEXT_PUBLIC_99FREELAS_URL: ""
      NEXT_PUBLIC_WORKANA_URL: ""
      NEXT_PUBLIC_BUYMEACOFFEE_URL: ""
      NEXT_PUBLIC_FACEBOOK_URL: ""
      NEXT_PUBLIC_FIGMA_URL: ""
      NEXT_PUBLIC_FIGMA_ORIGINAL_DESIGN: ""
      NEXT_PUBLIC_CONTACT_EMAIL: "contato@ricardocamilo.com"
      NEXT_PUBLIC_WHATSAPP_URL: "https://wa.me/5511999999999"
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ""
      NEXT_PUBLIC_GTM_ID: ""
      NEXT_PUBLIC_COUNTER_DEV_ID: ""
      PROJECT_TITLE: ""
      PORT: ""
      GOOGLE_SITE_VERIFICATION: ""
      COUNTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build do projeto
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: .next/
          retention-days: 7

  security:
    name: Auditoria de Seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Auditoria de vulnerabilidades
        shell: bash
        run: |
          set -o pipefail
          LOG_FILE="$(mktemp)"

          pnpm audit --audit-level moderate 2>&1 | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE" "$LOG_FILE" && grep -Eq "responded with 5[0-9]{2}([^0-9]|$)|error \(5[0-9]{2}\)" "$LOG_FILE"; then
            echo "::warning::pnpm audit falhou por erro 5xx do endpoint de auditoria da npm."
            exit 0
          fi

          exit "$status"

  sonar:
    name: Analise SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nao bloqueante: o sonar-project.properties aponta para um SonarQube local
    # (localhost:9000), inacessivel no runner hospedado. So roda quando o
    # secret SONAR_HOST_URL estiver configurado.
    continue-on-error: true
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run SonarScanner
        if: ${{ env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube ignorado
        if: ${{ env.SONAR_HOST_URL == '' }}
        run: echo "::warning::SonarQube ignorado - secret SONAR_HOST_URL ausente (o servidor local nao e acessivel no ubuntu-latest)."

  deploy:
    name: Deploy Netlify
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Nao bloqueante: o secret NETLIFY_SITE_ID nao esta configurado no repo e o
    # site ja e publicado pela integracao Git do Netlify.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build do projeto
        run: pnpm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify deploy --prod --dir=.next